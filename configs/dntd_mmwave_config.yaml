# dntd_mmwave_config.yaml
# ForeForce — mmWave Safety Node Configuration
#
# Configures the safety node (dntd_mmwave_safety_node.py).
# For the driver/sensor config see dntd_mmwave_driver_config.yaml.
#
# Run from the repo root with:
#   python3 src/dntd_mmwave_safety_node.py \
#     --ros-args --params-file configs/dntd_mmwave_config.yaml
#
# No topic remap is needed — the driver node publishes /dntd/mmwave/raw_points
# directly, which is the topic this node subscribes to.
#
# -----------------------------------------------------------------------------
# THIS IS A MINIMAL SINGLE-JOINT CONFIG.
#
# It is deliberately scoped to what the pipeline actually does today: one
# rotating joint, with the sensor mounted proximal to every joint that moves.
# That case is exact, not approximate — if the sensor sits below everything
# that bends, its position depends only on that one joint.
#
# Do not treat the values below as tuned for your arm. At minimum you must set
# sensor_mount_xyz (Step 2) and joint_names (Step 3) before this means anything
# on your hardware.
#
# Per-site overrides: rather than editing this file, put your own values in a
# second params file containing only the keys you change, layered after this one:
#     --params-file configs/dntd_mmwave_config.yaml \
#     --params-file configs/dntd_mmwave_config.local.yaml
# `.local.yaml` is gitignored, so bench values never become a commit.
# -----------------------------------------------------------------------------

dntd_mmwave_safety:
  ros__parameters:

    # =========================================================================
    # STEP 1 — SENSOR MOUNT LINK
    # =========================================================================
    # NOTE: not currently read by the node. The chain is built from joint_names
    # plus built-in placeholder geometry, and the sensor offset is applied at
    # the end of that chain. Kept for forward compatibility with the URDF-driven
    # chain loader (see roadmap). Setting it has no effect yet.
    sensor_mount_link: "base_link"

    # =========================================================================
    # STEP 2 — SENSOR OFFSET  ** YOU MUST MEASURE THIS **
    # =========================================================================
    # XYZ offset (metres) from the mount link origin to the sensor.
    #
    # For a single vertical-axis joint, only the HORIZONTAL distance from the
    # rotation axis to the sensor affects ego-motion compensation — the height
    # term drops out of the cross product for a Z-axis rotation. Measure it
    # bird's-eye: horizontal distance from directly above the pivot to directly
    # above the sensor, ignoring height. Include the height anyway for a
    # complete vector; it costs nothing and matters once other joints move.
    #
    # The placeholder below is NOT a working default. An offset that does not
    # match your hardware will mis-compensate the arm's own motion.
    sensor_mount_xyz: [0.0, 0.0, 0.05]

    # RPY rotation (radians) from mount link frame to sensor frame
    sensor_mount_rpy: [0.0, 0.0, 0.0]


    # =========================================================================
    # STEP 3 — KINEMATIC CHAIN
    # =========================================================================
    # These names must match exactly what your controller publishes in
    # /joint_states. The node looks up angles BY NAME — a mismatch does not
    # error, it silently reads every joint as 0.0 and ego-motion compensation
    # quietly does nothing. Check with:
    #     ros2 topic echo /joint_states --once
    #
    # arm_controller_node.py in this repo publishes: joint_base, joint_shoulder,
    # joint_elbow, joint_forearm, joint_wrist1, joint_wrist2.
    #
    # List ONLY the joints between the arm base and the sensor mount. Joints
    # distal to the sensor do not move it and must not be listed.
    joint_names:
      - "joint_base"

    # -------------------------------------------------------------------------
    # joint_geometry — NOT CURRENTLY LOADED
    #
    # The chain builder does not declare or read this block, so ROS 2 drops it
    # and the chain falls back to built-in placeholder geometry (0.1 m per
    # joint, all Z-axis). Consuming it is the next item on the ROS 2 roadmap.
    #
    # Consequences today:
    #   - Single-joint vertical-axis setups are still exact: the placeholder
    #     axis is correct and the measured sensor offset is applied on top.
    #   - Multi-joint ego-motion compensation is approximate.
    #   - The swept-volume clipper detects the placeholder chain and fail-safes
    #     to full pass-through, so it suppresses nothing.
    #
    # The block below shows the intended format; arm_config_gui.py writes it
    # correctly. Filling it in for your arm is harmless now and takes effect
    # when the loader lands.
    # -------------------------------------------------------------------------
    joint_geometry:
      joint_base:
        type: revolute
        origin_xyz: [0.0, 0.0, 0.0]
        origin_rpy: [0.0, 0.0, 0.0]
        axis: [0.0, 0.0, 1.0]     # vertical rotation axis


    # =========================================================================
    # TIMING
    # =========================================================================
    interpolate_joint_states: true
    joint_states_timeout_s: 0.5
    heartbeat_hz: 5.0


    # =========================================================================
    # STEP 4 — ZONE GEOMETRY (metres)
    # =========================================================================
    #   stop_range_m      — minimum safe clearance at max arm speed. Start at
    #                       0.5 m; reduce only after controlled testing.
    #   caution_range_m   — should allow enough time to decelerate. Typically
    #                       2-3x stop_range.
    #   fast_approach_mps — lower = more sensitive. -0.8 m/s ≈ brisk walk.
    #   static_filter_mps — drops near-static returns (walls, furniture, mount
    #                       hardware). A stationary person also falls below this
    #                       threshold; that case is handled by the presence hold
    #                       below, NOT by lowering this value. Setting it to 0.0
    #                       lets every residual clutter return through as a valid
    #                       detection and will pin the arm in STOP.
    stop_range_m:       0.5
    caution_range_m:    1.2
    fast_approach_mps:  -0.8
    static_filter_mps:  0.15
    min_snr_db:         8.0


    # =========================================================================
    # STEP 5 — STATIC PRESENCE HOLD
    # =========================================================================
    # Once STOP is confirmed, holds it while a person remains in the stop zone,
    # even after they stop moving and the classifier can no longer see them.
    #
    #   hold_timeout_s   — seconds with no presence evidence before releasing.
    #   release_grace_s  — grace period after the hold clears, before resuming.
    #   occupancy_hold_s — short separate bridge: holds the last-seen zone when
    #                      detections momentarily drop out.
    #
    # BEFORE TRUSTING THIS: occupancy evidence is scoped to stop_range_m, which
    # assumes persistent static reflectors sit OUTSIDE that radius. A stubborn
    # unlearned reflector INSIDE the stop range will hold STOP indefinitely.
    # Watch an empty workspace for a minute with the node's diagnostic log and
    # note the range of anything that persists. If it lands inside your stop
    # range: mask it physically, raise min_snr_db, or tune cfarCfg in the chirp
    # profile to suppress it.
    hold_timeout_s:      5.0
    release_grace_s:     2.0
    occupancy_hold_s:    1.5

    # presence_hold_use_novelty — allow the presence hold to use background-model
    # novelty as evidence, in addition to occupancy.
    #
    # DEFAULT FALSE, and leave it false on a moving mount. Ego-motion
    # compensation corrects the velocity field only; point POSITIONS stay in the
    # sensor frame, so the background model voxelizes relative to the sensor
    # rather than the room. The learned map is therefore only valid at the base
    # angle it was learned at — at a materially different angle, static geometry
    # reads as novel and this path will hold STOP indefinitely.
    #
    # Safe to enable on a FIXED (non-rotating) mount, where it is a stronger
    # presence signal than occupancy alone. Moving voxelization into a fixed
    # world frame is on the roadmap and will remove this restriction.
    presence_hold_use_novelty: false


    # =========================================================================
    # BACKGROUND LEARNING
    # =========================================================================
    # Learns the static scene at startup; afterwards only novel objects reach
    # the classifier. The arm holds STOP during learning.
    #
    # RELEARN AFTER MOVING THE ARM **OR CHANGING ITS POSE** — see the sensor
    # frame note above. A saved map is reloaded automatically and skips the
    # learning phase silently, so a stale map gives no visible warning.
    #     ros2 topic pub --once /dntd/relearn_background std_msgs/Bool "data: true"
    #
    #   background_learning_s    — 5-10 s small controlled lab, 15 s typical
    #                              workshop, 30 s+ cluttered or changing space.
    #   background_voxel_size_m  — smaller = finer detail, more memory. 0.05 m
    #                              for precision work near clutter.
    #   background_hit_threshold — fraction of learning frames a voxel must
    #                              appear in to count as background (0.0-1.0).
    #                              Lower = more aggressive masking.
    background_learning_s:    15.0
    background_voxel_size_m:  0.10
    background_hit_threshold: 0.30


    # =========================================================================
    # MICRO-DOPPLER CLASSIFIER
    # =========================================================================
    # Rule-based person/object scoring on clustered returns.
    #
    # Safety stance: FAIL-SAFE
    #   PERSON  → passes to zone logic
    #   UNKNOWN → passes to zone logic (treated as PERSON)
    #   OBJECT  → suppressed, logged to logs/classifier_training.csv
    #
    # If it suppresses every cluster while novel points exist, the originals
    # pass through rather than reporting a false CLEAR.
    #
    #   velocity_spread_min — lower = more sensitive. Raise if stationary
    #                         equipment gets flagged.
    #   height_span_min     — lower catches crouching people. Raise if
    #                         floor-level clutter causes false positives.
    #   score_threshold     — 1 very sensitive, 4 very strict. 2 is the
    #                         conservative fail-safe default.
    #   eps_m               — DBSCAN cluster radius. Raise for sparse clouds.
    #
    # classifier_log_enabled builds a labelled dataset for future ML scoring
    # at no extra effort.
    classifier_enabled:             true
    classifier_eps_m:               0.40
    classifier_min_points:          2
    classifier_velocity_spread_min: 0.08
    classifier_height_span_min:     0.10
    classifier_point_count_min:     3
    classifier_score_threshold:     2
    classifier_log_enabled:         true


    # =========================================================================
    # SWEPT-VOLUME WORKSPACE CLIPPER
    # =========================================================================
    # Suppresses detections outside the arm's reachable envelope, and inside the
    # self-exclusion sphere around the mount (the arm's own body).
    #
    # INERT ON A PLACEHOLDER CHAIN. Because joint_geometry is not yet loaded
    # (Step 3), the clipper detects placeholder geometry and fail-safes to full
    # pass-through — it currently suppresses nothing. This is a fail-safe, not a
    # failure: pass-through never drops a real detection.
    #
    #   mount_joint_idx  — 0-indexed joint the sensor is mounted at, indexed into
    #                      joint_names above. Must be a valid index into that
    #                      list: 0 for the single-joint config here.
    #   max_reach_m      — 0.0 auto-computes from distal link lengths. With a
    #                      single-joint chain there are no distal joints, so
    #                      auto-compute falls to its 0.30 m floor — set this
    #                      manually to your arm's actual reach instead.
    #   self_radius_m    — exclusion sphere around the mount, roughly half the
    #                      arm link diameter.
    #   reach_margin_m   — margin beyond nominal reach.
    swept_volume_enabled:         true
    swept_volume_mount_joint_idx: 0
    swept_volume_max_reach_m:     1.0
    swept_volume_self_radius_m:   0.15
    swept_volume_reach_margin_m:  0.20


    # =========================================================================
    # OUTPUT INTERFACES
    # =========================================================================
    # All optional. Serial, GPIO, and MQTT publish simultaneously if set.
    #
    # LEAVE output_serial_port EMPTY if you are using arm_controller_node.py.
    # That node already owns the ESP32 serial port — it reads /joint_states from
    # it and writes zone commands back. Two processes opening the same port will
    # collide. This path is for driving a board directly with no ROS 2 bridge.
    #
    # Serial writes bare "CLEAR\n" / "CAUTION\n" / "STOP\n".
    # GPIO (Raspberry Pi BCM): 17=CLEAR, 27=CAUTION, 22=STOP.
    output_serial_port: ""
    output_use_gpio:    false
    output_mqtt_broker: ""
